 return `<h2>Customer &amp; Account Management</h2><div class="sub">Owners, contacts, communication history, expansion ideas, retention and upcoming RFPs.</div>
 <div class="kpis"><div class="kpi"><div class="l">Customers</div><div class="v">${cust.length}</div></div><div class="kpi"><div class="l">Customer retention (active)</div><div class="v">${ret}%</div></div>
 <div class="kpi"><div class="l">At risk</div><div class="v warn">${ACCTS.filter(a=>a.st==="At risk").length}</div></div><div class="kpi"><div class="l">Inactive accounts</div><div class="v bad">${ACCTS.filter(a=>a.st==="Inactive").length}</div></div>
 <div class="kpi"><div class="l">RFPs due in 60 days</div><div class="v">${rfp.length}</div></div></div>
 <div class="bar"><input type="text" placeholder="Search accounts" value="${esc(f.q)}" id="accq" style="min-width:220px">${["All","Customers","Prospects","At risk","Inactive"].map(x=>`<span class="chip ${f.f===x?"on":""}" data-chip="acc.f:${x}">${x}</span>`).join("")}</div>
 <div class="grid g2"><div class="card"><h3>Accounts<span class="sp">${rows.length}</span></h3><div style="overflow:auto"><table><tr><th>Account</th><th>Owner</th><th>Status</th><th class="num">Annual rev</th><th>Last contact</th><th>Next RFP</th>${S.tms?`<th class="num">Shipments/mo</th><th class="num">GP</th>`:""}</tr>
 ${rows.map(a=>`<tr class="row" data-acct="${a.id}"><td><b>${esc(a.n)}</b><div class="muted">${a.ind}</div></td><td>${a.own}<div class="muted">${repOffice(a.own)}</div></td><td><span class="st s-${a.st==="At risk"?"At":a.st}">${a.st}</span></td><td class="num">${money(a.rev)}</td><td class="${a.last>30?"flag":""}">${a.last} days ago</td><td>${a.rfp!==null?fdate(a.rfp):"None"}</td>${S.tms?`<td class="num">${a.ship||"–"}</td><td class="num">${a.type==="Customer"?a.gp+"%":"–"}</td>`:""}</tr>`).join("")}</table></div></div>
 <div><div class="card" style="margin-bottom:14px"><h3>Upcoming RFPs</h3>${rfp.sort((a,b)=>a.rfp-b.rfp).map(a=>`<div class="item"><div class="tx"><a class="l" data-acct="${a.id}"><b>${esc(a.n)}</b></a><div class="muted">${a.own}</div></div><b>${fdate(a.rfp)}</b></div>`).join("")}</div>
 <div class="card"><h3>Expansion ideas</h3>${cust.filter(a=>a.st!=="Inactive").slice(0,6).map(a=>`<div class="item"><div class="tx"><a class="l" data-acct="${a.id}"><b>${esc(a.n)}</b></a><div class="muted">${a.exp.join(" · ")}</div></div></div>`).join("")}</div></div></div>`;
}
const RULES=[
 {id:"r1",n:"Follow-up task 3 days after a quote is submitted",d:"Creates a task for the opportunity owner so no quote goes quiet.",run:()=>OPPS.filter(o=>o.st==="Quote Submitted").map(o=>({to:o.own,txt:`Task created: follow up on "${o.n}"`}))},
 {id:"r2",n:"Flag opportunities stalled 21+ days in a stage",d:"Notifies the owner and their manager and adds a flag to the record.",run:()=>OPPS.filter(stalled).map(o=>({to:OFFICES[repOffice(o.own)],txt:`${o.own}'s "${o.n}" has been in ${o.st} for ${o.ins} days`}))},
 {id:"r3",n:"Alert when a customer has no contact in 30 days",d:"Pings the account owner and creates a check-in task.",run:()=>ACCTS.filter(a=>a.type==="Customer"&&a.last>30).map(a=>({to:a.own,txt:`No contact with ${a.n} in ${a.last} days. Check-in task created.`}))},
 {id:"r4",n:"RFP reminder 30 days before the due date",d:"Reminds the owner and manager to start the response early.",run:()=>ACCTS.filter(a=>a.rfp!==null&&a.rfp<=30).map(a=>({to:a.own,txt:`${a.n} RFP is due ${fdate(a.rfp)}. Start the response.`}))},
 {id:"r5",n:"Weekly leadership digest, Mondays 7:00 AM",d:"Emails managers and posts to Teams: activity, pipeline, stalled deals, coaching flags.",run:()=>{const o=OPPS.filter(isOpen);return[{to:"All managers",txt:`Digest: ${ACT.filter(a=>a.d<7).length} activities this week, ${money(o.reduce((s,x)=>s+x.rev,0))} open pipeline, ${o.filter(stalled).length} stalled, ${o.filter(overdue).length} overdue next steps`}]}}
];
RULES.forEach(r=>S.rules[r.id]=true);
function tmsSeries(a){const r=rng(a.id*7);const base=a.ship||60;return[...Array(6)].map((_,i)=>{const sh=Math.round(base*(.8+r()*.4));const rev=Math.round(a.rev/12*(.85+r()*.3));return{m:new Date(2026,5+i,1).toLocaleDateString("en-US",{month:"short"}),sh,rev,gp:Math.round(rev*(a.gp/100)*(.9+r()*.2))}})}
function viewAutomation(){
 const a=acct(S.tmsAcct),ser=tmsSeries(a),mx=Math.max(...ser.map(s=>s.rev));
 return `<h2>Automation &amp; Integration</h2><div class="sub">Follow-ups and reporting that run on their own, connected to the tools the team already uses.</div>
 <div class="grid g2"><div class="card"><h3>Automation rules<span class="sp">toggle, then Run now to preview</span></h3>
 ${RULES.map(r=>`<div class="item"><div class="toggle ${S.rules[r.id]?"on":""}" data-rule="${r.id}"><i></i></div><div class="tx"><b>${r.n}</b><div class="muted">${r.d}</div></div><button class="btn" data-run="${r.id}">Run now</button></div>`).join("")}
 <h3 style="margin-top:16px">Run log &amp; Teams preview</h3>
 ${S.log.length?S.log.slice(0,8).map(l=>`<div class="teams"><div class="h">Teams · #sales-alerts · to ${esc(l.to)}</div>${esc(l.txt)}</div>`).join(""):`<div class="muted">Run a rule to see the tasks and Teams alerts it would send.</div>`}</div>
 <div><div class="card" style="margin-bottom:14px"><h3>Integrations</h3>
 <div class="integ item"><div class="ic" style="background:#0F6CBD">O</div><div class="tx"><b>Outlook</b><div class="muted">Log emails and meetings to the right account and contact. Calendar sync keeps the timeline current.</div></div><span class="pillc s-Active">Standard</span></div>
 <div class="integ item"><div class="ic" style="background:#5059C9">T</div><div class="tx"><b>Teams</b><div class="muted">Alerts and daily digests in channels. Look up records without leaving Teams.</div></div><span class="pillc s-Active">Standard</span></div>
 <div class="integ item"><div class="ic" style="background:#DD7A01">TM</div><div class="tx"><b>Transportation management system</b><div class="muted">Shipment volume, revenue and GP by account and lane. Scoped with your IT team.</div></div><span class="pillc s-Prospect">To scope</span></div>
 <div style="margin-top:10px;display:flex;align-items:center;gap:10px"><div class="toggle ${S.tms?"on":""}" data-tms="1"><i></i></div><span>Show sample TMS data in CRM</span></div></div>
 <div class="card"><h3>What TMS data adds to reports</h3><div class="muted" style="line-height:1.6">Revenue and GP per account next to the activity that earned it. Shipments per month by lane to spot decline early. Win/loss compared to real margin. Pipeline forecast checked against booked volume.</div></div></div></div>
 ${S.tms?`<div class="card" style="margin-top:14px"><h3>Sample TMS feed<span class="sp"><select data-f="tmsAcct">${ACCTS.filter(x=>x.type==="Customer").map(x=>`<option value="${x.id}" ${x.id===S.tmsAcct?"selected":""}>${esc(x.n)}</option>`).join("")}</select></span></h3>
 <div class="cols">${ser.map(s=>`<div class="c"><i style="height:${s.rev/mx*110+4}px"></i>${s.m}<br><b style="color:#181818">${money(s.rev)}</b><br>${s.sh} ship · GP ${money(s.gp)}</div>`).join("")}</div></div>`:""}`;
}
/* ---------- render + events ---------- */
function render(){
 const v={activity:viewActivity,pipeline:viewPipeline,leadership:viewLeadership,accounts:viewAccounts,automation:viewAutomation}[S.tab];
 const q=$("#accq"),keep=q&&document.activeElement===q;
 const tb=TABS.find(x=>x.k===S.tab);
 $("#view").innerHTML=v().replace(/^<h2>(.*?)<\/h2><div class="sub">(.*?)<\/div>/,(m,a,b)=>`<div class="ph"><div class="phi" style="background:${tb.c}">${a.charAt(0)}</div><div><div class="pht">${tb.t}</div><div class="phn">${a}</div></div><div class="phs">${b}</div></div>`);
 const nq=$("#accq");if(nq){nq.oninput=e=>{S.acc.q=e.target.value;const p=e.target.selectionStart;render();const z=$("#accq");z.focus();z.setSelectionRange(p,p)};if(keep)nq.focus()}
}
function openOpp(id){
 const o=OPPS.find(x=>x.id===id),a=acct(o.a);
 const next=STAGES[STAGES.indexOf(o.st)+1];
 $("#drawer").innerHTML=`<span class="x2" data-close="1">&times;</span><h3>${esc(o.n)}</h3><div class="muted" style="margin-bottom:10px"><a class="l" data-acct="${a.id}">${esc(a.n)}</a> · ${o.own}</div>
 <span class="st ${sCls(o.st)}">${o.st}</span> ${stalled(o)?'<span class="flag">Stalled</span>':""}
 <div style="margin-top:10px">${[["Type",o.ty],["Annual revenue",money(o.rev)],["Gross profit",money(o.rev*o.gp/100)+" ("+o.gp+"%)"],["Expected close",fdate(o.close)],["Days in stage",o.ins],["Next step",o.next],["Next step due",o.nd<0?-o.nd+" days overdue":fdate(o.nd)],["Office",repOffice(o.own)+" · "+OFFICES[repOffice(o.own)]]].map(r=>`<div class="row2"><span class="muted">${r[0]}</span><b>${esc(r[1])}</b></div>`).join("")}</div>
 <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${isOpen(o)&&next&&next!=="Lost"?`<button class="btn p" data-adv="${o.id}">Advance to ${next}</button>`:""}${isOpen(o)?`<button class="btn" data-lose="${o.id}">Mark lost</button>`:""}<button class="btn" data-openacct="${a.id}">Open account</button></div>`;
 $("#drawer").classList.add("open");
}
function openAcct(id){
 const a=acct(id),h=ACT.filter(x=>x.a===id).slice(0,8),opps=OPPS.filter(o=>o.a===id);
 $("#drawer").innerHTML=`<span class="x2" data-close="1">&times;</span><h3>${esc(a.n)}</h3><div class="muted" style="margin-bottom:8px">${a.ind} · <span class="st s-${a.st==="At risk"?"At":a.st}">${a.st}</span></div>
 ${[["Account owner",a.own+" · "+repOffice(a.own)],["Manager",OFFICES[repOffice(a.own)]],["Annual revenue",money(a.rev)],["GP",a.type==="Customer"?a.gp+"%":"n/a"],["Last contact",a.last+" days ago"],["Next RFP",a.rfp!==null?fdate(a.rfp):"None"]].map(r=>`<div class="row2"><span class="muted">${r[0]}</span><b>${esc(r[1])}</b></div>`).join("")}
 <div style="margin:10px 0"><span class="muted">Reassign owner</span><br><select data-reassign="${a.id}" style="width:100%;margin-top:4px">${REPS.map(r=>`<option ${r.n===a.own?"selected":""}>${r.n}</option>`).join("")}</select></div>
 <h3 style="font-size:14px;margin-top:14px">Contacts</h3>${a.ct.map(c=>`<div class="item">${esc(c)}</div>`).join("")}
 <h3 style="font-size:14px;margin-top:14px">Expansion ideas</h3><div class="muted">${a.exp.join(" · ")}</div>
 <h3 style="font-size:14px;margin-top:14px">Open opportunities</h3>${opps.filter(isOpen).map(o=>`<div class="item"><div class="tx"><a class="l" data-opp="${o.id}">${esc(o.n)}</a><div class="muted">${o.st} · ${money(o.rev)}</div></div></div>`).join("")||'<div class="muted">None</div>'}
 <h3 style="font-size:14px;margin-top:14px">Communication history</h3>${h.map(x=>`<div class="item"><div class="ic" style="background:${TIC[x.t][0]}">${TIC[x.t][1]}</div><div class="tx"><b>${x.s}</b><div class="muted">${x.rep} · ${x.d===0?"Today":x.d+" days ago"} · ${x.o}</div></div></div>`).join("")||'<div class="muted">No activity in the last 30 days.</div>'}
 <div style="margin-top:14px"><button class="btn p" data-act="logcall" data-pre="${a.id}">+ Log activity</button></div>`;
 $("#drawer").classList.add("open");
}
function logModal(pre){
 $("#modal").innerHTML=`<h3 style="margin:0 0 6px">Log activity</h3><label>Account</label><select id="m_a">${ACCTS.map(a=>`<option value="${a.id}" ${pre==a.id?"selected":""}>${esc(a.n)}</option>`).join("")}</select>
 <label>Type</label><select id="m_t"><option>Call</option><option>Email</option><option>Meeting</option></select><label>Subject</label><input id="m_s" type="text" value="Check-in call">
 <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close="1">Cancel</button><button class="btn p" id="m_ok">Save</button></div>`;
 $("#modalbg").classList.add("on");
 $("#m_ok").onclick=()=>{const a=acct(+$("#m_a").value);ACT.unshift({d:0,rep:a.own,a:a.id,t:$("#m_t").value,s:$("#m_s").value||"Activity",o:"Logged just now"});a.last=0;if(a.st==="Inactive"||a.st==="At risk"){}$("#modalbg").classList.remove("on");toast("Logged. Last contact on "+a.n+" is now today.");render();if($("#drawer").classList.contains("open"))openAcct(a.id)};
}
document.addEventListener("click",e=>{
 const t=e.target;const q=a=>t.closest("["+a+"]");let el;
 if(el=q("data-tab"))return go(el.dataset.tab);
 if(el=q("data-chip")){const[k,v]=el.dataset.chip.split(":");const[g,p]=k.split(".");S[g][p]=v;return render()}
 if(el=q("data-acct")){go("accounts");openAcct(+el.dataset.acct);return}
 if(el=q("data-openacct")){openAcct(+el.dataset.openacct);return}
 if(el=q("data-opp")){if(S.tab!=="pipeline"&&!t.closest("#drawer"))go("pipeline");openOpp(+el.dataset.opp);return}
 if(el=q("data-scope")){const k=el.dataset.scope;S.lead.scope=k.startsWith("o:")?k:k;return render()}
 if(el=q("data-done")){S.doneTasks[el.dataset.done]=true;toast("Marked complete");return render()}
 if(el=q("data-mktask")){const a=acct(+el.dataset.mktask);S.extraTasks.push({id:"x"+a.id,txt:"Re-engage "+a.n,acct:a.n,aid:a.id,own:a.own,days:0});toast("Task created for "+a.own);return render()}
 if(el=q("data-sched")){return toast("1:1 invite drafted for "+el.dataset.sched)}
 if(el=q("data-act")){return logModal(el.dataset.pre)}
 if(el=q("data-adv")){const o=OPPS.find(x=>x.id===+el.dataset.adv);o.st=STAGES[STAGES.indexOf(o.st)+1];o.ins=0;toast("Advanced to "+o.st);render();return openOpp(o.id)}
 if(el=q("data-lose")){const o=OPPS.find(x=>x.id===+el.dataset.lose);o.st="Lost";toast("Marked lost");render();return openOpp(o.id)}
 if(el=q("data-rule")){S.rules[el.dataset.rule]=!S.rules[el.dataset.rule];return render()}
 if(el=q("data-run")){const r=RULES.find(x=>x.id===el.dataset.run);if(!S.rules[r.id])return toast("Turn the rule on first");const res=r.run();S.log=res.concat(S.log);toast(res.length+" action"+(res.length===1?"":"s")+" from this rule");return render()}
 if(el=q("data-tms")){S.tms=!S.tms;return render()}
 if(q("data-close")){$("#drawer").classList.remove("open");$("#modalbg").classList.remove("on");return}
 if(t.id==="modalbg")$("#modalbg").classList.remove("on");
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.f){const[g,p]=t.dataset.f.split(".");if(p===undefined)S[g]=+t.value||t.value;else S[g][p]=t.value;render()}
 if(t.dataset.reassign){const a=acct(+t.dataset.reassign);a.own=t.value;toast("Owner changed to "+t.value);render();openAcct(a.id)}
});
$("#share").onclick=()=>{const u=location.href.split("#")[0]+"#"+S.tab;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("Link to this tab copied"),()=>toast("Share this file or its hosted link; add #"+S.tab+" to open this tab"))};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#drawer").classList.remove("open");$("#modalbg").classList.remove("on")}});
const h=location.hash.slice(1);if(TABS.find(t=>t.k===h))S.tab=h;
drawChrome();render();
</script>
</body>
</html>
